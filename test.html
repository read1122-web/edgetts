<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets 網頁版工具</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google API Scripts -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // 開發者設定區 (請在此填入你的資訊)
        // ==========================================
        // 注意：Client ID 在前端是公開的，這是正常的。
        // 但 API Key 建議加上 HTTP Referrer 限制 (在 Google Cloud Console 設定)，
        // 防止被其他網站盜用。
        
        const CONFIG = {
            API_KEY: "AIzaSyDQNmXcoVTOWHYaNQjzYXist7GLYUXvPZE", 
            CLIENT_ID: "92872277503-tm86p3uir9tucf2i3vhqnk73i4npqb9l.apps.googleusercontent.com" 
        };
        // ==========================================

        const App = () => {
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [tokenClient, setTokenClient] = useState(null);
            const [userInfo, setUserInfo] = useState(null);
            
            // 操作狀態
            const [sheetId, setSheetId] = useState('');
            const [range, setRange] = useState('Sheet1!A1');
            const [cellValue, setCellValue] = useState('');
            const [logs, setLogs] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [configError, setConfigError] = useState(false);

            // 新增 Log 的輔助函式 (移到 useEffect 外部以便取用)
            const addLog = (message, type = 'info') => {
                setLogs(prev => [{ time: new Date().toLocaleTimeString(), message, type }, ...prev]);
            };

            useEffect(() => {
                // 檢查開發者是否已填寫設定 (同步檢查，避免非同步 State 造成的問題)
                const isConfigInvalid = CONFIG.API_KEY.includes("在此填入") || CONFIG.CLIENT_ID.includes("在此填入");
                
                if (isConfigInvalid) {
                    setConfigError(true);
                    return; // 關鍵修正：如果設定無效，直接終止，不執行 gapi.load
                }

                const initGapi = () => {
                    gapi.load('client', async () => {
                        try {
                            await gapi.client.init({
                                apiKey: CONFIG.API_KEY,
                                discoveryDocs: ["https://sheets.googleapis.com/$discovery/rest?version=v4"],
                            });
                            // 初始化成功不一定代表已登入，但代表 API Key 有效
                        } catch (error) {
                            console.error("GAPI Init Error:", error);
                            // 這裡通常抓不到 API Key 錯誤，因為 init 是 promise，但為了保險起見
                            if (error.result && error.result.error) {
                                addLog(`初始化錯誤: ${error.result.error.message}`, "error");
                            }
                        }
                    });
                };

                initGapi();
            }, []);

            const handleLogin = () => {
                if (configError) {
                    alert("開發者尚未設定 API Key 或 Client ID");
                    return;
                }

                setIsLoading(true);
                const client = google.accounts.oauth2.initTokenClient({
                    client_id: CONFIG.CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/spreadsheets',
                    callback: async (response) => {
                        if (response.error) {
                            addLog(`登入失敗: ${response.error}`, "error");
                            setIsLoading(false);
                            return;
                        }
                        
                        setIsAuthorized(true);
                        setIsLoading(false);
                        addLog("登入成功！", "success");
                    },
                });
                setTokenClient(client);
                // 使用 prompt: 'select_account' 來達到強制選擇帳號的效果
                // 這等同於 Firebase 的 GoogleAuthProvider.PROMPT.SELECT_ACCOUNT
                client.requestAccessToken({ prompt: 'select_account' });
            };

            // 1. 新增
            const createSheet = async () => {
                if (!isAuthorized) return;
                setIsLoading(true);
                try {
                    const response = await gapi.client.sheets.spreadsheets.create({
                        properties: { title: `我的新試算表 (${new Date().toLocaleDateString()})` },
                    });
                    setSheetId(response.result.spreadsheetId);
                    addLog(`已建立新試算表`, "success");
                    addLog(`連結: ${response.result.spreadsheetUrl}`, "link");
                } catch (err) {
                    addLog(`建立失敗: ${err.message}`, "error");
                } finally {
                    setIsLoading(false);
                }
            };

            // 2. 修改
            const updateData = async () => {
                if (!isAuthorized || !sheetId) return;
                setIsLoading(true);
                try {
                    await gapi.client.sheets.spreadsheets.values.update({
                        spreadsheetId: sheetId, range: range, valueInputOption: 'USER_ENTERED',
                        resource: { values: [[cellValue]] },
                    });
                    addLog(`寫入成功: ${cellValue}`, "success");
                } catch (err) {
                    addLog(`寫入失敗: ${err.result?.error?.message || err.message}`, "error");
                } finally {
                    setIsLoading(false);
                }
            };

            // 3. 刪除
            const clearData = async () => {
                if (!isAuthorized || !sheetId) return;
                setIsLoading(true);
                try {
                    await gapi.client.sheets.spreadsheets.values.clear({
                        spreadsheetId: sheetId, range: range,
                    });
                    addLog(`已清除資料`, "success");
                } catch (err) {
                    addLog(`清除失敗: ${err.result?.error?.message || err.message}`, "error");
                } finally {
                    setIsLoading(false);
                }
            };

            if (configError) {
                return (
                    <div className="flex items-center justify-center h-screen bg-gray-100">
                        <div className="bg-white p-8 rounded-lg shadow-lg max-w-md text-center">
                            <h1 className="text-2xl font-bold text-red-600 mb-4">尚未設定完成</h1>
                            <p className="text-gray-700 mb-4">此工具需要開發者在程式碼中填入 <code>API_KEY</code> 與 <code>CLIENT_ID</code>。</p>
                            <p className="text-sm text-gray-500">請用文字編輯器打開此 HTML 檔案，搜尋 "CONFIG" 並填入對應資訊。</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* 頂部導航 */}
                    <nav className="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
                        <h1 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                            <svg className="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-2h2v2zm0-4H7v-2h2v2zm0-4H7V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
                            試算表小工具
                        </h1>
                        {!isAuthorized ? (
                            <button onClick={handleLogin} disabled={isLoading} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition flex items-center gap-2">
                                {isLoading && <div className="loader border-white border-t-transparent"></div>}
                                登入 Google 帳號
                            </button>
                        ) : (
                            <span className="text-green-600 text-sm font-medium bg-green-50 px-3 py-1 rounded-full border border-green-200">
                                ● 已連線
                            </span>
                        )}
                    </nav>

                    <main className="max-w-5xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                        
                        {/* 左側操作區 */}
                        <div className="md:col-span-2 space-y-6">
                            {/* 功能卡片 */}
                            <div className={`bg-white rounded-xl shadow-sm border p-6 transition-all ${!isAuthorized ? 'opacity-50 pointer-events-none filter blur-[1px]' : ''}`}>
                                
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-lg font-semibold text-gray-800">試算表操作</h2>
                                    <button onClick={createSheet} className="text-sm bg-green-100 text-green-700 hover:bg-green-200 px-3 py-1 rounded transition flex items-center gap-1">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                        建立新試算表
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Spreadsheet ID</label>
                                        <input type="text" value={sheetId} onChange={(e) => setSheetId(e.target.value)} 
                                            className="w-full bg-gray-50 border border-gray-200 rounded px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none" 
                                            placeholder="請輸入 ID 或先建立新表" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">儲存格 (例如 A1)</label>
                                            <input type="text" value={range} onChange={(e) => setRange(e.target.value)} 
                                                className="w-full bg-gray-50 border border-gray-200 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">內容</label>
                                            <input type="text" value={cellValue} onChange={(e) => setCellValue(e.target.value)} 
                                                className="w-full bg-gray-50 border border-gray-200 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" 
                                                placeholder="輸入文字..." />
                                        </div>
                                    </div>

                                    <div className="flex gap-3 pt-2">
                                        <button onClick={updateData} disabled={isLoading || !sheetId} className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded font-medium transition disabled:bg-gray-300">
                                            寫入資料
                                        </button>
                                        <button onClick={clearData} disabled={isLoading || !sheetId} className="flex-1 bg-white border border-red-200 text-red-600 hover:bg-red-50 py-2 rounded font-medium transition disabled:text-gray-400 disabled:border-gray-200 disabled:bg-transparent">
                                            清除資料
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            {!isAuthorized && (
                                <div className="text-center p-8 bg-blue-50 rounded-xl border border-blue-100">
                                    <p className="text-blue-800 font-medium">請先點擊右上角登入 Google 帳號</p>
                                    <p className="text-blue-600 text-sm mt-1">此工具將存取您的 Google 試算表</p>
                                </div>
                            )}
                        </div>

                        {/* 右側 Log */}
                        <div className="md:col-span-1">
                            <div className="bg-gray-900 rounded-xl shadow-lg p-4 h-[500px] flex flex-col">
                                <div className="flex justify-between items-center mb-2 pb-2 border-b border-gray-700">
                                    <span className="text-gray-400 text-xs font-mono">SYSTEM LOGS</span>
                                    <button onClick={() => setLogs([])} className="text-gray-500 hover:text-white text-xs">Clear</button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2 font-mono text-xs">
                                    {logs.length === 0 && <p className="text-gray-600 italic text-center mt-10">等待操作中...</p>}
                                    {logs.map((log, i) => (
                                        <div key={i} className="break-all">
                                            <span className="text-gray-500 mr-2">[{log.time}]</span>
                                            {log.type === 'link' ? (
                                                <a href={log.message.split(': ')[1]} target="_blank" className="text-blue-400 hover:underline">開啟試算表 &rarr;</a>
                                            ) : (
                                                <span className={log.type === 'error' ? 'text-red-400' : log.type === 'success' ? 'text-green-400' : 'text-gray-300'}>
                                                    {log.message}
                                                </span>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
